spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    compatibility-verifier:
      enabled: false
    sentinel:                      # 👈 新增 Sentinel 配置
      transport:
        dashboard: localhost:8858
        port: 8719                 # 客户端与控制台通信端口（如果被占用会自动+1）
      eager: true                  # 启动时立即向控制台注册
server:
  port: 8082